; Version: v1.0.0-alpha (Modern Platform Baseline: ESP-IDF 5.3 / Arduino Core 3.1)
; ============================================================================

[platformio]
default_envs = esp32_ehu32_v2

[env:esp32_ehu32_v2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.partitions = min_spiffs.csv
board_build.flash_mode = qio

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags = 
    -Os
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BT_CLASSIC_ENABLED=1
    -DCONFIG_BT_A2DP_ENABLE=1
    -DCONFIG_TWAI_ISR_IN_IRAM=1

lib_deps = 
    https://github.com/pschatzmann/ESP32-A2DP/archive/refs/tags/v1.8.11.zip
